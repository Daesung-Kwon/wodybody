name: Frontend CI/CD

on:
  push:
    branches: [ main ]
    paths: [ 'frontend/**', 'burnfat/src/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'frontend/**', 'burnfat/src/**' ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run tests
      working-directory: ./frontend
      run: npm test

    - name: Build
      working-directory: ./frontend
      env:
        VITE_API_URL: ${{ secrets.REACT_APP_API_URL }}
        VITE_SUPABASE_URL: ${{ secrets.BURNFAT_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.BURNFAT_SUPABASE_ANON_KEY }}
        VITE_AI_ADVICE_URL: ${{ secrets.BURNFAT_AI_ADVICE_URL }}
      run: npm run build

    - name: Deploy to Vercel
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./frontend
        vercel-args: '--prod'
