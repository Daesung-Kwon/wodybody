[build]
# Railway deprecated Nixpacks; only RAILPACK and DOCKERFILE are valid.
# builder=NIXPACKS caused every main deploy since 2026-10-05 to fail.
builder = "RAILPACK"
# Watch patterns are always relative to repo root (even when Root Directory=/backend).
watchPatterns = ["backend/**"]

[deploy]
# Portable across Root Directory=/backend and Root Directory=/ (repo root).
# Do NOT use bare `cd backend && gunicorn…` — when Root=/backend that cd fails
# with "No such file or directory". See backend/start.sh.
startCommand = "bash -c 'if [ -f start.sh ]; then exec bash start.sh; else exec bash backend/start.sh; fi'"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[git]
# PR 및 프로덕션은 main 기준이므로 main에서 자동 배포 허용
# legacy 실험용 backend 브랜치도 유지
deploymentEnabled.main = true
deploymentEnabled.backend = true
deploymentEnabled.frontend = false
