[build]
builder = "NIXPACKS"

[deploy]
# gunicorn + eventlet 워커. Root Directory=/backend 이므로 cd 불필요.
# eventlet 0.36.1 로 Python 3.12 distutils 충돌 해소(2026-05-19). WSGI 타깃은
# app:app — Flask-SocketIO 의 socketio 객체는 WSGI 콜러블이 아니라서
# app:socketio 는 "Application object must be callable" 로 기동 실패한다.
startCommand = "gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 5 --log-level info app:app"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[git]
# PR 및 프로덕션은 main 기준이므로 main에서 자동 배포 허용
# legacy 실험용 backend 브랜치도 유지
deploymentEnabled.main = true
deploymentEnabled.backend = true
deploymentEnabled.frontend = false
