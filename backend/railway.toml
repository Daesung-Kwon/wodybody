[build]
builder = "NIXPACKS"

[deploy]
# NOTE: gunicorn(--worker-class eventlet) 전환은 Python 3.12 + eventlet 0.33.3 의
# distutils 제거 충돌로 기동 실패함(2026-05-18, 커밋 7aa7ac4). gunicorn 전환은
# eventlet 업그레이드(>=0.35) 선행이 필요하며, 그때까지 python app.py 를 유지한다.
# 상세·후속 계획: burnfat/docs/SPRINT3A_HANDOFF.md §4
startCommand = "python app.py"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[git]
# PR 및 프로덕션은 main 기준이므로 main에서 자동 배포 허용
# legacy 실험용 backend 브랜치도 유지
deploymentEnabled.main = true
deploymentEnabled.backend = true
deploymentEnabled.frontend = false
