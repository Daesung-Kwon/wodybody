[build]
builder = "NIXPACKS"

[deploy]
startCommand = "gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 5 --log-level info app:socketio"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
# Root Directory = /backend 이므로 컨테이너 cwd(/app) 가 backend 콘텐츠 루트.
# gunicorn 이 app 모듈을 import 하려면 /app 이 PYTHONPATH 에 있어야 한다.
PYTHONPATH = "/app"

[git]
# PR 및 프로덕션은 main 기준이므로 main에서 자동 배포 허용
# legacy 실험용 backend 브랜치도 유지
deploymentEnabled.main = true
deploymentEnabled.backend = true
deploymentEnabled.frontend = false
