# Fallback when Railway Config-as-Code path is /railway.toml (not /backend/railway.toml).
# Preferred SSOT: set dashboard Config path to /backend/railway.toml and Root Directory=/backend.
[build]
builder = "RAILPACK"
watchPatterns = ["backend/**"]

[deploy]
# Portable: Root=/backend → bash start.sh; Root=/ → bash backend/start.sh
startCommand = "bash -c 'if [ -f start.sh ]; then exec bash start.sh; else exec bash backend/start.sh; fi'"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
FLASK_ENV = "production"
